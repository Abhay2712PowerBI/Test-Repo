name: Fullstack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Server Dependencies
        run: |
          cd fullstack-app/server
          npm ci
      - name: Run Server Tests
        run: |
          cd fullstack-app/server
          npm test

  client-build:
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Client Dependencies
        run: |
          cd fullstack-app/client
          npm ci
      - name: Build Client
        run: |
          cd fullstack-app/client
          npm run build
